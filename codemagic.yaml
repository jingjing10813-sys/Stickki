# Codemagic 클라우드 iOS 빌드 (맥 없이 빌드하기 위한 설정)
#
# 사용 전 준비 (Apple Developer 계정 개설 후):
#   1. Codemagic(codemagic.io) 가입 → 이 GitHub 레포 연결
#   2. Teams > Integrations 에서 App Store Connect API 키 등록
#   3. 아래 ios_signing 은 Codemagic 이 자동 서명 처리
#
# 계정 개설 전에는 이 파일은 준비용 — 실행해도 서명 단계에서 실패함.

workflows:
  ios-spike:
    name: iOS 스파이크 빌드 (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.stickki.app
    scripts:
      - name: 의존성 설치
        script: npm ci
      - name: Capacitor 동기화
        script: npx cap sync ios
      - name: iOS ipa 빌드
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
