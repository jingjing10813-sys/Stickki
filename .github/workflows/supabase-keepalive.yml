name: supabase-keepalive

# 무료 플랜 7일 미사용 자동 일시정지 방지용 — 주 2회 REST 호출
on:
  schedule:
    - cron: "0 0 * * 1,4" # 월·목 UTC 00:00
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5YnJibWFsdW1la2FqeWtweXN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NjAzODksImV4cCI6MjA5MDQzNjM4OX0.XBBhve3VoOoxewEC31UF5LltOORUmYbnDzVChuRD4y8
        run: |
          curl -fsS "https://aybrbmalumekajykpysu.supabase.co/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
